name: CI and desktop artifacts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiworlded-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run unit tests
        run: bun run testrun

      - name: Build web bundle
        run: bun run build

      - name: Verify generated web bundle
        run: git diff --exit-code -- docs

      - name: Run strict TypeScript check
        continue-on-error: true
        run: bun run typecheck:strict

  desktop-build:
    name: Build ${{ matrix.platform }} desktop artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Electrobun package
        run: bun run desktop:build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiworlded-${{ matrix.platform }}-${{ github.sha }}
          path: desktop_artifacts/
          if-no-files-found: error
          retention-days: 30

name: CI and desktop artifacts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiworlded-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run unit tests
        run: bun run testrun

      - name: Build web bundle
        run: bun run build

      - name: Restore static favicon files
        run: |
          git checkout HEAD -- \
            docs/favicon.ico \
            docs/favicon-16x16.png \
            docs/favicon-32x32.png \
            docs/apple-touch-icon.png \
            docs/android-chrome-192x192.png \
            docs/android-chrome-512x512.png \
            docs/site.webmanifest

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Run strict TypeScript check
        continue-on-error: true
        run: bun run typecheck:strict

  desktop-build:
    name: Build ${{ matrix.platform }} desktop artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Electrobun package
        run: bun run desktop:build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiworlded-${{ matrix.platform }}-${{ github.sha }}
          path: desktop_artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Automatic Release
    needs: desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Downloads windows, linux, and macos artifacts into a local 'release_assets' directory
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: aiworlded-*
          path: release_assets/
          merge-multiple: true

      # Generates a clean timestamp identifier (e.g., 20260724-a1b2c3d)
      - name: Generate Release Tag
        id: tag
        run: |
          TAG_NAME="build-$(date +'%Y%m%d')-${{ github.sha }}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      # Automatically creates a Rolling Release on your GitHub panel
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: 'Automated Build: ${{ steps.tag.outputs.tag_name }}'
          body: 'Automated desktop binaries compiled from commit ${{ github.sha }}.'
          files: release_assets/**/*
          generate_release_notes: true

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

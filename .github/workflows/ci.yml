name: CI and desktop artifacts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiworlded-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run unit tests
        run: bun run testrun

      - name: Build web bundle
        run: bun run build

      # Favicons live in public/ and are copied into docs/ by Vite on every
      # build (relative links in index.html / site.webmanifest). No restore step.

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Run strict TypeScript check
        continue-on-error: true
        run: bun run typecheck:strict

  desktop-build:
    name: Build ${{ matrix.platform }} desktop artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Embed a unique semver into package.json before Electrobun packages the app.
      # Patch comes from GITHUB_RUN_NUMBER so each main build gets a newer version
      # for the native updater UI and version.json.
      - name: Assign desktop release version
        id: version
        shell: bash
        run: |
          VERSION="$(bun scripts/ci_release_version.ts --write)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Desktop release version: ${VERSION}"

      - name: Build Electrobun package
        run: bun run desktop:build

      # Versioned Setup for humans + Electrobun-named portable/update.json for auto-update.
      # No duplicate Portable aliases and no hash-named .patch files.
      - name: Package clean release assets
        shell: bash
        run: |
          bun scripts/package_desktop_release.ts \
            --version "${{ steps.version.outputs.version }}" \
            --input desktop_artifacts \
            --output release_dist

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiworlded-${{ matrix.platform }}-${{ github.sha }}
          path: release_dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Automatic Release
    needs: desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Same formula as desktop-build (major.minor from package.json + run number).
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(bun scripts/ci_release_version.ts)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      # Downloads windows, linux, and macos artifacts into a local 'release_assets' directory
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: aiworlded-*
          path: release_assets/
          merge-multiple: true

      # Setup zips for manual install; stable-*-update.json + stable-*-*.tar.zst for native auto-update.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 'AI World Editor v${{ steps.version.outputs.version }}'
          body: |
            Automated desktop build of **AI World Editor v${{ steps.version.outputs.version }}** from commit `${{ github.sha }}`.

            ### Downloads
            - **`AiWorldEd-<version>-<Platform>-<arch>-Setup.*`** — installer for that platform (`.zip` on Windows, `.tar.gz` on Linux)
            - **`stable-<os>-<arch>-AiWorldEd*.tar.zst`** — portable app bundle (also the in-app auto-update payload)
            - **`stable-<os>-<arch>-update.json`** — auto-update metadata used by the desktop app

            Keep the `stable-*` files on the release so existing installs can update automatically.
          files: release_assets/**/*
          generate_release_notes: true

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
